services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kernle
      POSTGRES_PASSWORD: kernle
      POSTGRES_DB: kernle
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kernle"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://kernle:kernle@postgres:5432/kernle?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars!!
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars!
      APP_URL: http://localhost:3001
      API_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3001
      ROOT_DOMAIN: localhost
      AI_MOCK: "true"
      RUN_SEED: "true"
      STORAGE_PATH: /data/assets
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: kernle-assets
      S3_REGION: us-east-1
      S3_PUBLIC_URL: http://localhost:9010/kernle-assets
    volumes:
      - api_assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  api_assets:
